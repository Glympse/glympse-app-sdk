apply plugin: 'com.android.library'
android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 5
        targetSdkVersion 36
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
    namespace "com.glympse.android.intent.lib"
}
